# LoadBalancer — Exposes the service to external traffic.
# Cloud providers (AWS EKS, GKE, AKS) will provision an external IP/DNS.
# For local clusters (minikube) run: minikube tunnel
apiVersion: v1
kind: Service
metadata:
  name: legacy-app-lb
  labels:
    app: legacy-app
    service-type: external
  annotations:
    # AWS: use NLB instead of classic ELB
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: legacy-app
  ports:
    - name: http
      protocol: TCP
      port: 80          # external port clients connect to
      targetPort: 3000  # container port
  # Optional: restrict inbound to trusted CIDR ranges
  # loadBalancerSourceRanges:
  #   - "0.0.0.0/0"
