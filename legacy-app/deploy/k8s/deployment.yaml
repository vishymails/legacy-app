apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-app
  labels:
    app: legacy-app
    version: "1.0.0"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: legacy-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # allow one extra pod during rollout
      maxUnavailable: 1  # allow one pod to be down during rollout
  template:
    metadata:
      labels:
        app: legacy-app
        version: "1.0.0"
    spec:
      # ── Security: drop all capabilities, run as non-root ──────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: legacy-app
          image: legacy-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # ── Factor III: config from environment ───────────────────
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"

          # ── Resource guardrails ────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # ── Liveness probe: restart the pod if the app deadlocks ───
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          # ── Readiness probe: hold traffic until the app is ready ───
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

      # Spread pods across nodes so one node failure ≠ full outage
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: legacy-app
